<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Courtside – tennis court</title>
  <meta name="description" content="A tennis court seen from a fixed isometric angle in a pixel-art style.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Courtside</h1>
    <canvas id="court" tabindex="0" role="img"
      aria-label="Tennis court seen from above at an angle, with baselines, sidelines, service boxes and the net">
      Your browser cannot show the court.
    </canvas>
    <div class="controls">
      <button id="shader-toggle" type="button" aria-pressed="true">Pixel shader: on</button>
      <p class="hint">Keys: <kbd>S</kbd> shader on/off, <kbd>↑</kbd> <kbd>↓</kbd> raise or lower the ball.</p>
    </div>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
